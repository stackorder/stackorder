name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/stackorder/stackorder
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  visibility:
    needs: image
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check every pushed tag is anonymously pullable
        env:
          TAGS: ${{ needs.image.outputs.tags }}
          SETTINGS: https://github.com/orgs/stackorder/packages/container/stackorder/settings
        run: |
          set -euo pipefail
          if [ -z "${TAGS//[[:space:]]/}" ]; then
            echo "::error::The image job exposed no tags to verify."
            exit 1
          fi
          failed=0
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            path=${ref#ghcr.io/}
            name=${path%:*}
            tag=${path##*:}
            token=$(curl -fsS --retry 3 "https://ghcr.io/token?scope=repository:${name}:pull" | jq -r '.token // empty') || token=""
            status=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${name}/manifests/${tag}") || status=000
            if [ "$status" = 200 ]; then
              echo "${ref} is anonymously pullable."
            else
              echo "::error::${ref} is not anonymously pullable (HTTP ${status}). Make the package public at ${SETTINGS}, then re-run this job to re-verify the release."
              failed=1
            fi
          done <<< "$TAGS"
          exit "$failed"
