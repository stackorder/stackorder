version: 1

stacks:
  discover: ["stacks/**", "infra/**"]
  instances:
    from_var_files: "workspaces/*.tfvars.json"

env:
  TF_VAR_environment: "{{ .Instance }}"
  TF_VAR_role: { plan: plan, apply: deploy }

modules:
  paths: ["modules/**"]

tool: terraform

environments:
  "stacks/prod/": production
  "stacks/staging/": staging

apply:
  mode: before_merge
  require_approvals: 1
  four_eyes: false
  from_plan: true

propagate:
  dependents: true
  cross_repo: plan

drift:
  schedule: "0 6 * * 1-5"
  open_issue: true

plan_output: full
