<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>{{.Title}} · Stackorder</title>
<style nonce="{{.Nonce}}">
:root { color-scheme: light dark; --fg: #1f2328; --muted: #59636e; --bg: #f6f8fa; --card: #ffffff; --line: #d1d9e0; --accent: #0969da; --warn: #9a6700; }
@media (prefers-color-scheme: dark) { :root { --fg: #f0f6fc; --muted: #9198a1; --bg: #0d1117; --card: #151b23; --line: #3d444d; --accent: #4493f8; --warn: #d29922; } }
* { box-sizing: border-box; }
body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 24px 28px; }
h1 { font-size: 1.5rem; margin: 0 0 12px; }
h2 { font-size: 1.1rem; margin: 24px 0 8px; }
p, li { color: var(--fg); }
.muted { color: var(--muted); }
.warn { color: var(--warn); font-weight: 600; }
a { color: var(--accent); }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.875rem; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow-x: auto; white-space: pre; }
button, .button { display: inline-block; font: inherit; font-weight: 600; color: #ffffff; background: #1f883d; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; text-decoration: none; }
ul, ol { padding-left: 20px; }
footer { max-width: 760px; margin: 12px auto 0; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
{{template "content" .}}
</main>
<footer>Stackorder {{.Version}}</footer>
</body>
</html>
