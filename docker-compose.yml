services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stackorder
      POSTGRES_PASSWORD: stackorder
      POSTGRES_DB: stackorder
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackorder"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: s3
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"\\(running\\|available\\)\"'"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://stackorder:stackorder@postgres:5432/stackorder?sslmode=disable
      STACKORDER_BASE_URL: http://localhost:8080
      STACKORDER_LOG_FORMAT: text
    ports:
      - "8080:8080"
    profiles: ["server"]
